<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聊天室</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --bg2: #171921;
    --bg3: #1e2130;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #e8eaf0;
    --text2: #8b90a4;
    --text3: #555a70;
    --accent: #5b8def;
    --accent2: #3d6fd4;
    --sys: #4a9068;
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    overflow: hidden;
  }

  /* ─── Login overlay ─── */
  #login-overlay {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    transition: opacity 0.4s, transform 0.4s;
  }
  #login-overlay.hidden { opacity: 0; pointer-events: none; transform: scale(0.97); }

  .login-card {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 20px;
    padding: 48px 40px;
    width: 380px;
    text-align: center;
  }
  .login-card .logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text3);
    letter-spacing: 0.15em;
    margin-bottom: 32px;
    text-transform: uppercase;
  }
  .login-card h1 {
    font-size: 28px;
    font-weight: 300;
    color: var(--text);
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }
  .login-card p {
    font-size: 14px;
    color: var(--text2);
    margin-bottom: 36px;
  }
  .login-card input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    font-size: 15px;
    font-family: 'Noto Sans SC', sans-serif;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 16px;
  }
  .login-card input:focus { border-color: var(--accent); }
  .login-card input::placeholder { color: var(--text3); }
  .login-card button {
    width: 100%;
    background: var(--accent);
    border: none;
    border-radius: var(--radius-sm);
    padding: 14px;
    font-size: 15px;
    font-family: 'Noto Sans SC', sans-serif;
    font-weight: 500;
    color: #fff;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .login-card button:hover { background: var(--accent2); }
  .login-card button:active { transform: scale(0.98); }
  #login-error {
    font-size: 13px;
    color: #e05c5c;
    margin-top: 12px;
    min-height: 20px;
  }

  /* ─── Main layout ─── */
  #app { display: flex; width: 100%; height: 100dvh; }

  /* Sidebar */
  #sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 24px 16px 16px;
  }
  .sidebar-logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text3);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 28px;
    padding-left: 4px;
  }
  .sidebar-section {
    font-size: 11px;
    color: var(--text3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 10px;
    padding-left: 4px;
  }
  #user-list { flex: 1; overflow-y: auto; }
  .user-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    color: var(--text2);
  }
  .user-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .user-item.me { color: var(--text); font-weight: 500; }
  #sidebar-bottom {
    border-top: 1px solid var(--border);
    padding-top: 14px;
    font-size: 12px;
    color: var(--text3);
  }
  #my-nickname-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text2);
    padding: 4px 8px;
  }

  /* Chat area */
  #chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  /* Header */
  #chat-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  #chat-header .room-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
  }
  #chat-header .online-count {
    font-size: 12px;
    color: var(--text3);
  }

  /* Messages */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .msg-row {
    display: flex;
    flex-direction: column;
    padding: 3px 0;
  }
  .msg-row.system {
    align-items: center;
    padding: 8px 0;
  }
  .sys-text {
    font-size: 12px;
    color: var(--sys);
    background: rgba(74,144,104,0.1);
    padding: 4px 12px;
    border-radius: 20px;
  }
  .msg-header {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 3px;
  }
  .msg-nick {
    font-size: 13px;
    font-weight: 500;
  }
  .msg-time {
    font-size: 11px;
    color: var(--text3);
    font-family: 'JetBrains Mono', monospace;
  }
  .msg-text {
    font-size: 14px;
    color: var(--text);
    line-height: 1.6;
    word-break: break-word;
    padding-left: 0;
  }
  .msg-image {
    max-width: 320px;
    max-height: 280px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border2);
    cursor: pointer;
    transition: opacity 0.2s;
    display: block;
    margin-top: 4px;
    object-fit: cover;
  }
  .msg-image:hover { opacity: 0.9; }

  /* Consecutive messages from same user: hide repeated header */
  .msg-row.cont .msg-header { display: none; }
  .msg-row.cont { padding-top: 1px; }

  /* Input area */
  #input-area {
    padding: 16px 24px 20px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  #input-box {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 10px 14px;
    transition: border-color 0.2s;
  }
  #input-box:focus-within { border-color: var(--accent); }
  #msg-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    font-size: 14px;
    font-family: 'Noto Sans SC', sans-serif;
    color: var(--text);
    resize: none;
    max-height: 120px;
    line-height: 1.5;
  }
  #msg-input::placeholder { color: var(--text3); }

  .input-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text3);
    padding: 4px;
    border-radius: 6px;
    transition: color 0.2s, background 0.2s;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .input-btn:hover { color: var(--text2); background: var(--border); }
  #send-btn { color: var(--accent); }
  #send-btn:hover { color: #fff; background: var(--accent); }

  #file-input { display: none; }

  /* Image upload preview */
  #img-preview-wrap {
    margin-bottom: 8px;
    display: none;
  }
  #img-preview-wrap.show { display: flex; align-items: center; gap: 10px; }
  #img-preview {
    width: 64px; height: 64px;
    object-fit: cover;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border2);
  }
  #img-cancel {
    font-size: 12px;
    color: var(--text3);
    cursor: pointer;
    background: none;
    border: none;
    padding: 4px 8px;
    border-radius: 6px;
    transition: color 0.2s;
  }
  #img-cancel:hover { color: #e05c5c; }

  /* Image lightbox */
  #lightbox {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    cursor: zoom-out;
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 90vw; max-height: 90vh; border-radius: var(--radius); }

  /* Notification bar */
  #notif-bar {
    position: fixed;
    top: 16px; left: 50%; transform: translateX(-50%);
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    padding: 8px 20px;
    border-radius: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 300;
    white-space: nowrap;
  }
  #notif-bar.show { opacity: 1; }

  /* Mobile */
  @media (max-width: 600px) {
    #sidebar { display: none; }
    #messages { padding: 14px 14px; }
    #input-area { padding: 12px 14px 16px; }
    .login-card { width: 92vw; padding: 36px 24px; }
  }
</style>
</head>
<body>

<!-- Login -->
<div id="login-overlay">
  <div class="login-card">
    <div class="logo">chatroom · v1</div>
    <h1>加入聊天室</h1>
    <p>输入昵称，立即开始聊天</p>
    <input id="nickname-input" type="text" placeholder="你的昵称..." maxlength="20" autocomplete="off">
    <button id="join-btn">进入聊天室</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <div id="sidebar">
    <div class="sidebar-logo">// chat</div>
    <div class="sidebar-section">在线用户</div>
    <div id="user-list"></div>
    <div id="sidebar-bottom">
      <div id="my-nickname-display"></div>
    </div>
  </div>

  <div id="chat-area">
    <div id="chat-header">
      <div class="room-name"># 公共聊天室</div>
      <div class="online-count" id="online-count">0 人在线</div>
    </div>

    <div id="messages"></div>

    <div id="input-area">
      <div id="img-preview-wrap">
        <img id="img-preview" src="" alt="">
        <button id="img-cancel">✕ 取消</button>
      </div>
      <div id="input-box">
        <textarea id="msg-input" rows="1" placeholder="输入消息... (Enter 发送，Shift+Enter 换行)"></textarea>
        <label for="file-input" class="input-btn" title="发送图片">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
        </label>
        <input type="file" id="file-input" accept="image/*">
        <button id="send-btn" class="input-btn" title="发送">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div id="lightbox"><img id="lightbox-img" src="" alt=""></div>

<!-- Notification -->
<div id="notif-bar" id="notif-bar"></div>

<script>
const $ = id => document.getElementById(id);

let ws, myNickname, myColor;
let lastSender = null, lastTime = 0;
let pendingImageFile = null;
let notifTimer = null;
let hasFocus = true;
let unreadCount = 0;
const originalTitle = '聊天室';

// Focus tracking
window.addEventListener('focus', () => { hasFocus = true; unreadCount = 0; document.title = originalTitle; });
window.addEventListener('blur', () => { hasFocus = false; });

// Notification permission
if ('Notification' in window && Notification.permission === 'default') {
  Notification.requestPermission();
}

function showNotifBar(text) {
  const bar = $('notif-bar');
  bar.textContent = text;
  bar.classList.add('show');
  clearTimeout(notifTimer);
  notifTimer = setTimeout(() => bar.classList.remove('show'), 3000);
}

function pushNotification(title, body) {
  if (hasFocus) return;
  unreadCount++;
  document.title = `(${unreadCount}) ${originalTitle}`;
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(title, { body, icon: '' });
  }
}

// ── Login ──
$('join-btn').addEventListener('click', tryJoin);
$('nickname-input').addEventListener('keydown', e => { if (e.key === 'Enter') tryJoin(); });

function tryJoin() {
  const nick = $('nickname-input').value.trim();
  if (!nick) { $('login-error').textContent = '请输入昵称'; return; }
  connectWS(nick);
}

function connectWS(nick) {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);

  ws.addEventListener('open', () => {
    ws.send(JSON.stringify({ type: 'join', nickname: nick }));
  });

  ws.addEventListener('message', e => {
    const data = JSON.parse(e.data);
    handleMessage(data);
  });

  ws.addEventListener('close', () => {
    showNotifBar('连接断开，3秒后重连...');
    setTimeout(() => connectWS(myNickname || nick), 3000);
  });
}

function handleMessage(data) {
  switch (data.type) {
    case 'joined':
      myNickname = data.nickname;
      myColor = data.color;
      $('login-overlay').classList.add('hidden');
      $('my-nickname-display').textContent = myNickname;
      break;

    case 'error':
      $('login-error').textContent = data.message;
      if (ws) ws.close();
      break;

    case 'history':
      $('messages').innerHTML = '';
      lastSender = null; lastTime = 0;
      data.messages.forEach(renderMsg);
      scrollToBottom();
      break;

    case 'system':
      renderMsg(data);
      scrollToBottom();
      break;

    case 'message':
    case 'image':
      renderMsg(data);
      scrollToBottom();
      if (data.nickname !== myNickname) {
        pushNotification(data.nickname, data.type === 'image' ? '[图片]' : data.text);
        if (!hasFocus) showNotifBar(`${data.nickname}: ${data.type === 'image' ? '[图片]' : data.text.slice(0,30)}`);
      }
      break;

    case 'users':
      renderUsers(data.users);
      break;
  }
}

function renderMsg(data) {
  const box = $('messages');
  const now = data.time || Date.now();

  if (data.type === 'system') {
    const row = document.createElement('div');
    row.className = 'msg-row system';
    row.innerHTML = `<span class="sys-text">${esc(data.text)}</span>`;
    box.appendChild(row);
    lastSender = null;
    return;
  }

  const isCont = data.nickname === lastSender && (now - lastTime) < 5 * 60 * 1000;
  lastSender = data.nickname;
  lastTime = now;

  const row = document.createElement('div');
  row.className = 'msg-row' + (isCont ? ' cont' : '');

  const timeStr = new Date(now).toLocaleTimeString('zh', { hour: '2-digit', minute: '2-digit' });
  const isMe = data.nickname === myNickname;

  let contentHTML = '';
  if (data.type === 'image') {
    contentHTML = `<img class="msg-image" src="${esc(data.url)}" alt="图片" loading="lazy">`;
  } else {
    contentHTML = `<div class="msg-text">${esc(data.text).replace(/\n/g, '<br>')}</div>`;
  }

  row.innerHTML = `
    <div class="msg-header">
      <span class="msg-nick" style="color:${data.color}">${esc(data.nickname)}${isMe ? ' (我)' : ''}</span>
      <span class="msg-time">${timeStr}</span>
    </div>
    ${contentHTML}
  `;

  // Image lightbox
  const img = row.querySelector('.msg-image');
  if (img) {
    img.addEventListener('click', () => {
      $('lightbox-img').src = img.src;
      $('lightbox').classList.add('open');
    });
  }

  box.appendChild(row);
}

function renderUsers(users) {
  const list = $('user-list');
  list.innerHTML = '';
  $('online-count').textContent = `${users.length} 人在线`;
  users.forEach(u => {
    const el = document.createElement('div');
    el.className = 'user-item' + (u.nickname === myNickname ? ' me' : '');
    el.innerHTML = `<div class="user-dot" style="background:${u.color}"></div><span>${esc(u.nickname)}</span>`;
    list.appendChild(el);
  });
}

function scrollToBottom() {
  const m = $('messages');
  m.scrollTop = m.scrollHeight;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Send message ──
const input = $('msg-input');

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// Auto-resize textarea
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

$('send-btn').addEventListener('click', sendMessage);

function sendMessage() {
  if (!ws || !myNickname) return;

  if (pendingImageFile) {
    uploadAndSend();
    return;
  }

  const text = input.value.trim();
  if (!text) return;
  ws.send(JSON.stringify({ type: 'message', text }));
  input.value = '';
  input.style.height = 'auto';
}

// ── Image ──
$('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  pendingImageFile = file;
  const reader = new FileReader();
  reader.onload = ev => {
    $('img-preview').src = ev.target.result;
    $('img-preview-wrap').classList.add('show');
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

$('img-cancel').addEventListener('click', () => {
  pendingImageFile = null;
  $('img-preview-wrap').classList.remove('show');
  $('img-preview').src = '';
});

async function uploadAndSend() {
  if (!pendingImageFile) return;
  const formData = new FormData();
  formData.append('image', pendingImageFile);
  pendingImageFile = null;
  $('img-preview-wrap').classList.remove('show');
  $('img-preview').src = '';

  try {
    const res = await fetch('/upload', { method: 'POST', body: formData });
    const json = await res.json();
    if (json.url) ws.send(JSON.stringify({ type: 'image', url: json.url }));
  } catch {
    showNotifBar('图片上传失败，请重试');
  }
}

// ── Lightbox ──
$('lightbox').addEventListener('click', () => $('lightbox').classList.remove('open'));
</script>
</body>
</html>
